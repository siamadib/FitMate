<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1816"/>
      <stop offset="100%" stop-color="#0c0b0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a29"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Machine Frame Structure -->
  <rect x="180" y="30" width="16" height="230" fill="#332d29" rx="4"/>
  <path d="M120 40 L260 40 L250 55 L130 55 Z" fill="#443c37"/>
  <rect x="80" y="240" width="220" height="20" fill="#26211e" rx="6"/>
  <!-- Pulley Wheels -->
  <circle cx="135" cy="50" r="14" fill="#ff7a29"/>
  <circle cx="245" cy="50" r="14" fill="#ff7a29"/>
  <!-- Cable -->
  <line x1="135" y1="50" x2="135" y2="100" stroke="#888" stroke-width="3"/>
  <line x1="245" y1="50" x2="245" y2="120" stroke="#888" stroke-width="3"/>
  <!-- Lat Pulldown Wide Bar -->
  <path d="M70 100 Q135 110 200 100" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Seat and Thigh Pads -->
  <rect x="150" y="180" width="80" height="16" fill="#1b1716" stroke="#ff7a29" stroke-width="2" rx="4"/>
  <rect x="155" y="140" width="70" height="14" fill="#ff7a29" rx="7"/>
  <!-- Weight Stack Plate Column -->
  <rect x="235" y="120" width="22" height="90" fill="#2b2522" stroke="#554b45" rx="2"/>
  <line x1="235" y1="135" x2="257" y2="135" stroke="#ff7a29" stroke-width="1.5"/>
  <line x1="235" y1="150" x2="257" y2="150" stroke="#554b45" stroke-width="1.5"/>
  <line x1="235" y1="165" x2="257" y2="165" stroke="#554b45" stroke-width="1.5"/>
  <line x1="235" y1="180" x2="257" y2="180" stroke="#554b45" stroke-width="1.5"/>
  <text x="200" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ff7a29" text-anchor="middle">LAT PULLDOWN MACHINE (SAMPLE)</text>
</svg>
